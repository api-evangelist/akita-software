aid: akita-software
name: Akita Software
description: >-
  Akita Software was an API observability and analysis platform that used
  passive traffic monitoring to automatically map APIs, detect changes, and
  identify issues. Akita was acquired by Postman in 2023 and its technology has
  been integrated into the Postman platform as Postman Live Insights.
