apis:
  - aid: akita-software:akita-software
    name: Akita Software
    description: >-
      Akita Software provided an API observability platform that used passive
      traffic monitoring to automatically discover, map, and model APIs without
      requiring code changes. It could generate API specs from traffic,
      detect breaking changes, and monitor API performance. Akita was acquired
      by Postman in November 2023, and its capabilities are now available as
      Postman Live Insights.
