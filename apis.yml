  - type: Features
    data:
      - name: Passive Traffic Monitoring
        description: >-
          Monitors API traffic passively without code changes, SDK installation,
          or proxying, minimizing operational overhead and risk.
      - name: Automatic API Spec Generation
        description: >-
          Generates OpenAPI specifications automatically from observed traffic,
          keeping documentation always up to date.
      - name: Breaking Change Detection
        description: >-
          Detects breaking API changes by comparing observed traffic patterns
          across deployments and branches.
      - name: API Performance Monitoring
        description: >-
          Tracks API response times, error rates, and traffic patterns to help
          identify performance regressions.
      - name: Multi-Platform Integration
        description: >-
          Integrates with Docker, Kubernetes, NGINX, Rails, Django, Flask,
          FastAPI, and Heroku for broad platform coverage.
  - type: UseCases
    data:
      - name: API Documentation Generation
        description: >-
          Engineering teams automatically generate and maintain up-to-date API
          specs from production traffic without manual effort.
      - name: API Change Management
        description: >-
          Teams detect unintentional API breaking changes between branches or
          deployments before they reach production.
      - name: API Discovery
        description: >-
          Organizations discover undocumented and shadow APIs by monitoring
          actual network traffic across their services.
      - name: Production API Monitoring
        description: >-
          DevOps teams monitor API behavior and performance in production to
          quickly identify and diagnose issues.
  - type: Integrations
    data:
      - name: Docker
        description: Docker extension and container integration for traffic monitoring
      - name: Kubernetes
        description: Kubernetes deployment support for monitoring microservice APIs
      - name: NGINX
        description: NGINX module for mirroring API traffic to the Akita agent
      - name: Heroku
        description: Heroku buildpack for integrating Akita with Heroku applications
      - name: Postman
        description: Acquired by Postman in 2023; technology integrated as Postman Live Insights
