aid: akita-software
name: Akita Software
description: >-
  Akita Software was an API observability and analysis platform that used
  passive traffic monitoring to automatically map APIs, detect changes, and
  identify issues without requiring code changes or proxies. Akita was acquired
  by Postman in July 2023 (announced 2023-07-19) and its technology has been integrated into the
  Postman platform as Postman Live Insights. The Akita agent is now available
  as the open-source Postman Insights Agent.
