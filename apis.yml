apis:
  - aid: akita-software:akita-software
    name: Akita Software
    description: >-
      Akita Software provided an API observability platform that used passive
      traffic monitoring to automatically discover, map, and model APIs without
      requiring code changes or proxying. It could generate API specs from
      traffic, detect breaking changes, and monitor API performance. Akita was
      acquired by Postman in July 2023 (announced 2023-07-19), and its capabilities
      are now
      available as Postman Live Insights with the open-source Postman Insights
      Agent.
    humanURL: https://www.akitasoftware.com
