    note: >-
      Akita's own marketing host. Every path, including the site root, answers
      HTTP 403 with a Cloudflare "Attention Required / Sorry, you have been
      blocked" interstitial (4,578 bytes of HTML) to both curl and a browser
      User-Agent. This is an edge block, not a missing document — the state of
      these paths is unknown, not absent.
    documents:
      - path: /.well-known/security.txt
        status: 403
        file: null
