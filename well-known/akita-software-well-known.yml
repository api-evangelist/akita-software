specification: API Commons Well-Known
specificationVersion: '0.1'
provider: Akita Software
providerId: akita-software
generated: '2026-08-30'
method: probed
source: >-
  direct HTTPS GETs on 2026-08-30 with a browser User-Agent against every host
  named in apis.yml plus the observability API host recovered from the
  open-source agent source
description: >-
  Well-known document probe for Akita Software. NO POINTER IS EMITTED from this
  file. Every host Akita itself controls either returns a Cloudflare 403 to all
  crawlers (www.akitasoftware.com) or no longer resolves (the akita.software
  domain has expired). The only 200s recorded below were served by
  postman.com hosts, which belong to Postman — the acquirer — and are profiled
  separately at all/postman; crediting Akita with Postman's security.txt,
  llms.txt or api-catalog would be a misattribution, so they are recorded here
  as evidence only and neither saved verbatim into this repo nor pointed at from
  apis.yml.
hosts:
